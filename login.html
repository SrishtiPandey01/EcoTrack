<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | EcoTrack</title>

   
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"> EcoTrack </a>

        <a href="registration.html" class="btn btn-light"> Register </a>
      </div>
    </nav>

    <!-- Login Section -->
    <main class="login-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-7 col-lg-5">
            <div class="login-card">
              <h2 class="text-center text-success">Welcome Back!</h2>

              <p class="text-center text-muted">
                Login to your EcoTrack Account
              </p>

              <!-- Login Form -->
              <form id="loginForm" onsubmit="return loginValidation()">
                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label"> Email Address </label>

                  <input
                    type="text"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label"> Password </label>

                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Enter your password"
                    />

                    <button
                      type="button"
                      class="btn btn-outline-success"
                      id="togglePassword"
                      onclick="showPassword()"
                    >
                      Show
                    </button>
                  </div>
                </div>

                <!-- Remember Me -->
                <div class="form-check mb-3">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="rememberMe"
                  />

                  <label for="rememberMe" class="form-check-label">
                    Remember Me
                  </label>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-success w-100">
                  Login
                </button>

                <!-- Validation Message -->
                <p
                  id="message"
                  class="text-center mt-3 mb-0"
                  role="status"
                  aria-live="polite"
                ></p>
              </form>

              <hr />

              <p class="text-center mb-0">
                Don't have an account?
                <a href="registration.html"> Register Now </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    
    <footer class="bg-success text-white text-center p-3">
      <p class="mb-0">© 2026 EcoTrack | Save Environment, Save Future</p>
    </footer>

    <script src="js/login.js"></script>
  </body>
</html>
