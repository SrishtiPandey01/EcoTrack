<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Waste History | EcoTrack</title>

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    
    <link rel="stylesheet" href="./css/waste-history.css" />
  </head>

  <body>
   
    <nav class="navbar navbar-dark eco-navbar">
      <div class="container">
        <a href="dashboard.html" class="navbar-brand fw-bold"> 🌿 EcoTrack </a>

        <a href="dashboard.html" class="btn back-btn"> Dashboard </a>
      </div>
    </nav>

    
    <main class="container history-section">
      <div class="heading-section">
        <h1>Waste History</h1>
        <p>View and manage your recorded waste details.</p>
      </div>

      <!-- Summary Cards -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="summary-card">
            <p>Total Records</p>
            <h3 id="totalRecords">0</h3>
          </div>
        </div>

        <div class="col-md-6">
          <div class="summary-card">
            <p>Total Waste</p>
            <h3 id="totalQuantity">0 kg</h3>
          </div>
        </div>
      </div>

      <!-- History Table -->
      <div class="table-card">
        <h4>Recorded Waste</h4>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Waste Type</th>
                <th>Quantity</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="historyTable">
              <!-- JavaScript adds records here -->
            </tbody>
          </table>
        </div>

        <p id="emptyMessage" class="empty-message">
          No waste records found. Add your first waste record!
        </p>
      </div>

      
<div class="text-center mt-4">
    <a href="addWaste.html" class="btn add-btn">
        + Add New Waste
    </a>
</div>

    </main>

    
    <footer>
      <p>© 2026 EcoTrack | Building a Greener Future 🌍</p>
    </footer>

    
    <script src="./js/waste-history.js"></script>
  </body>
</html>
