<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | EcoTrack</title>

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    
    <nav class="navbar navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"> EcoTrack </a>

        <a href="index.html" class="btn btn-light"> Home </a>
      </div>
    </nav>

    <!-- Registration Form -->
    <div class="register-container">
      <div class="register-box">
        <h2>Create Account</h2>

        <p class="subtitle">Join EcoTrack for a greener future.</p>

        <form>
          <label>Full Name</label>

          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="Enter your name"
          />

          <p id="nameError" class="error"></p>

          <label>Email Address</label>

          <input
            type="text"
            id="email"
            class="form-control"
            placeholder="Enter your email"
          />

          <p id="emailError" class="error"></p>

          <label>Mobile Number</label>

          <input
            type="text"
            id="mobile"
            class="form-control"
            placeholder="Enter mobile number"
            maxlength="10"
          />

          <p id="mobileError" class="error"></p>

          <label>Password</label>

          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Create password"
          />

          <p id="passwordError" class="error"></p>

          <label>Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm password"
          />

          <p id="confirmError" class="error"></p>

          <div class="terms">
            <input type="checkbox" id="terms" />

            <label for="terms"> I agree to Terms and Conditions </label>
          </div>

          <p id="termsError" class="error"></p>

          <button
            type="button"
            class="btn btn-success register-btn"
            onclick="validateForm()"
          >
            Register Now
          </button>

          <p id="successMessage" class="success"></p>
        </form>

        <p class="login-link">
          Already have an account?
          <a href="login.html">Login Here</a>
        </p>
      </div>
    </div>

    
    <footer>© 2026 EcoTrack | Smart Waste Management System</footer>

    
    <script src="js/app.js"></script>
  </body>
</html>
